<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#29164d">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mixer</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Sound mixer">
      <section class="pads" aria-label="Sound pads">
        <button class="pad pad--star empty" data-pad="0" data-name="star" aria-label="Empty star pad. Hold to record."><svg class="art" viewBox="0 0 100 100" aria-hidden="true"><path d="m50 12 11 24 27 4-20 19 5 28-23-13-23 13 5-28-20-19 27-4Z" fill="#fff0a8" stroke="#fff9de" stroke-width="4" stroke-linejoin="round"/><path d="m42 32-5 11-12 2" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/></svg><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--heart empty" data-pad="1" data-name="heart" aria-label="Empty heart pad. Hold to record."><svg class="art" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 84 19 54C-3 31 25 8 43 28l7 8 7-8C75 8 103 31 81 54Z" fill="#ffe1eb"/><path d="M24 39q0-12 12-9" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/></svg><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--rainbow empty" data-pad="2" data-name="rainbow" aria-label="Empty rainbow pad. Hold to record."><svg class="art" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke-width="10"><path d="M14 69a36 36 0 0 1 72 0" stroke="#ffcec7"/><path d="M25 69a25 25 0 0 1 50 0" stroke="#ffeab3"/><path d="M36 69a14 14 0 0 1 28 0" stroke="#d0f8ea"/></g><g fill="white"><ellipse cx="18" cy="73" rx="14" ry="8"/><ellipse cx="82" cy="73" rx="14" ry="8"/></g></svg><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--moon empty" data-pad="3" data-name="moon" aria-label="Empty moon pad. Hold to record."><svg class="art" viewBox="0 0 100 100" aria-hidden="true"><path d="M65 16A36 36 0 1 0 84 70 33 33 0 0 1 65 16Z" fill="#fff0bd"/><path d="m79 20 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#efeaff"/><circle cx="87" cy="51" r="3" fill="white"/></svg><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--flower empty" data-pad="4" data-name="flower" aria-label="Empty flower pad. Hold to record."><svg class="art" viewBox="0 0 100 100" aria-hidden="true"><g fill="#ffdfed"><ellipse cx="50" cy="28" rx="14" ry="21"/><ellipse cx="50" cy="72" rx="14" ry="21"/><ellipse cx="28" cy="50" rx="21" ry="14"/><ellipse cx="72" cy="50" rx="21" ry="14"/></g><circle cx="50" cy="50" r="17" fill="#ffe399"/><circle cx="46" cy="46" r="5" fill="#fff2cf"/></svg><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--spiral empty" data-pad="5" data-name="spiral" aria-label="Empty spiral pad. Hold to record."><svg class="art" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 50c-10-12-25 4-13 17 18 19 45-6 29-29C44 8 4 35 20 67c19 38 74 15 66-25" fill="none" stroke="#dbf4ff" stroke-width="10" stroke-linecap="round"/><circle cx="85" cy="29" r="5" fill="white"/></svg><span class="progress" aria-hidden="true"></span></button>
      </section>
      <nav class="controls" aria-label="Main controls">
        <button id="stop" class="control stop" aria-label="Stop"><span aria-hidden="true">■</span></button>
        <div id="trash" hidden role="img" aria-label="Drop here to clear recording"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h20M12 9V5h8v4M9 9l1 19h12l1-19M14 14v9M18 14v9"/></svg></div>
        <button id="settings" class="control settings" aria-label="Settings"><span aria-hidden="true">⚙</span></button>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <dialog id="gate" class="dialog">
      <form method="dialog" class="card" id="gate-form">
        <button class="close" id="close-gate" type="button" aria-label="Close">×</button>
        <p class="eyebrow">Grown-ups only</p>
        <h1 id="question">12 + 34 = ?</h1>
        <input id="answer" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="Answer">
        <p id="gate-error" class="error" aria-live="polite"></p>
        <button class="wide" value="default">Open settings</button>
      </form>
    </dialog>

    <dialog id="parent" class="dialog">
      <section class="card settings-card">
        <button class="close" id="close-settings" aria-label="Close">×</button>
        <p class="eyebrow">Grown-ups</p><h1>Settings</h1>
        <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.85"></label>
        <button id="permission" class="wide">Enable microphone</button>
        <button id="install" class="wide" hidden>Install this app</button>
        <p class="privacy">To clear a recording, drag its pad onto the trash can. Release anywhere else to keep it.</p>
        <p class="privacy">Recordings stay on this tablet and disappear when the page closes.</p>
      </section>
    </dialog>
    <script src="app.js" defer></script>
  </body>
</html>
