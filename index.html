<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#29164d">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mixer</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Sound mixer">
      <section class="pads" aria-label="Sound pads">
        <button class="pad pad--star empty" data-pad="0" aria-label="Empty star pad. Hold to record."><span class="art">★</span><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--heart empty" data-pad="1" aria-label="Empty heart pad. Hold to record."><span class="art">♥</span><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--rainbow empty" data-pad="2" aria-label="Empty rainbow pad. Hold to record."><span class="art">⌒</span><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--moon empty" data-pad="3" aria-label="Empty moon pad. Hold to record."><span class="art">☾</span><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--flower empty" data-pad="4" aria-label="Empty flower pad. Hold to record."><span class="art">✿</span><span class="progress" aria-hidden="true"></span></button>
        <button class="pad pad--spiral empty" data-pad="5" aria-label="Empty spiral pad. Hold to record."><span class="art">◎</span><span class="progress" aria-hidden="true"></span></button>
      </section>
      <nav class="controls" aria-label="Main controls">
        <button id="stop" class="control stop" aria-label="Stop"><span aria-hidden="true">■</span></button>
        <button id="settings" class="control settings" aria-label="Settings"><span aria-hidden="true">⚙</span></button>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <dialog id="gate" class="dialog">
      <form method="dialog" class="card" id="gate-form">
        <button class="close" id="close-gate" type="button" aria-label="Close">×</button>
        <p class="eyebrow">Grown-ups only</p>
        <h1 id="question">12 + 34 = ?</h1>
        <input id="answer" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="Answer">
        <p id="gate-error" class="error" aria-live="polite"></p>
        <button class="wide" value="default">Open settings</button>
      </form>
    </dialog>

    <dialog id="parent" class="dialog">
      <section class="card settings-card">
        <button class="close" id="close-settings" aria-label="Close">×</button>
        <p class="eyebrow">Grown-ups</p><h1>Settings</h1>
        <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.85"></label>
        <button id="permission" class="wide">Enable microphone</button>
        <button id="install" class="wide" hidden>Install this app</button>
        <p class="privacy">To clear a recording, hold its pad and shake the tablet.</p>
        <p class="privacy">Recordings stay on this tablet and disappear when the page closes.</p>
      </section>
    </dialog>
    <script src="app.js" defer></script>
  </body>
</html>
